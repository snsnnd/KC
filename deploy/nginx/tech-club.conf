# ================================================================
# 科创社 CMS — Nginx 反向代理配置
# 部署路径: /etc/nginx/sites-available/tech-club.conf
# 启用方式: ln -s /etc/nginx/sites-available/tech-club.conf /etc/nginx/sites-enabled/
# 本配置实现了: HTTP→HTTPS 重定向、TLS 终止、反向代理、静态资源服务、安全标头。
# ================================================================

# ---- HTTP 默认服务器（拦截未绑定域名的 HTTP 流量） ----
# 拒绝所有未匹配的 HTTP 请求（返回 444 即直接断开连接，不返回任何内容）。
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    # 安全注意：关闭 nginx 版本号泄露
    server_tokens off;

    return 444;
}

# ---- HTTP → HTTPS 重定向服务器 ----
# 为合法域名 example.com 的 HTTP 流量执行 301 重定向到 HTTPS 版本，
# 同时处理 Let's Encrypt 的 ACME 验证请求。
server {
    listen 80;
    listen [::]:80;

    server_name example.com;
    root /var/www/tech-club-showcase/current;
    server_tokens off;

    # Let's Encrypt 证书续签验证路径 —— 不重定向此路径，允许 HTTP 访问
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tech-club-acme;
        default_type text/plain;
        allow all;
    }

    # 所有其他 HTTP 请求重定向到 HTTPS
    location / {
        return 301 https://example.com$request_uri;
    }
}

# ---- HTTPS 默认服务器（拦截未绑定域名的 HTTPS 流量） ----
# 拒绝所有未匹配的 TLS 连接，防止 IP 直接访问。
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    server_name _;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    # 安全注意：仅启用 TLSv1.2 和 TLSv1.3，禁用不安全的 SSLv3/TLSv1.0/TLSv1.1
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    return 444;
}

# ---- HTTPS 主服务器（业务流量入口） ----
# 处理所有对 example.com 的安全请求，提供前端静态资源和 API 反向代理。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name example.com;
    root /var/www/tech-club-showcase/current;
    index index.html;

    # --- SSL/TLS 配置 ---
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # SSL Session 缓存：共享 10MB，可容纳约 40000 个 Session
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # 安全注意：禁用 Session Ticket 以增强 PFS（完美前向保密）
    ssl_session_tickets off;

    # --- 全局设置 ---
    charset utf-8;
    server_tokens off;
    # 限制请求体大小：常规请求 2MB；特殊接口（如上传）单独配置
    client_max_body_size 2m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    # --- 安全响应头 ---
    # HSTS：强制浏览器在 1 年内始终通过 HTTPS 访问
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 禁止 MIME 类型嗅探（防止 XSS 攻击中 MIME 混淆）
    add_header X-Content-Type-Options "nosniff" always;
    # 禁止在 iframe 中加载页面（防止点击劫持）
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Referrer 策略：仅在同源或 HTTPS→HTTPS 时发送 Referer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 权限策略：禁用摄像头、麦克风和地理位置 API
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 内容安全策略：限制脚本、样式、资源的加载来源
    # 注意：style-src 使用了 'unsafe-inline'（管理后台使用了内联样式）
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self' https: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto:" always;

    # --- 路径规则 ---

    # 安全：拒绝所有以点开头的隐藏文件/目录访问（.git, .env, .htaccess 等）
    location ~ /\. {
        deny all;
    }

    # 前端静态路由：SPA 单页应用，所有路径尝试静态文件，找不到返回 404
    # 不设缓存（expires -1），确保用户总是获取最新版本
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # 管理控制台使用独立发布根，可在不影响展示站的情况下发布和回滚。
    location = /admin.html {
        root /var/www/tech-club-control/current;
        try_files /admin.html =404;
        expires -1;
    }

    location = /assets/js/admin.js {
        root /var/www/tech-club-control/current;
        try_files /assets/js/admin.js =404;
        expires 5m;
    }

    location = /assets/css/admin.css {
        root /var/www/tech-club-control/current;
        try_files /assets/css/admin.css =404;
        expires 5m;
    }

    # ---- API 反向代理路由 ----

    # 库存图片上传接口 —— 单独的请求体大小限制（3MB，适合图片）
    location = /api/admin/inventory-image {
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 文件上传接口 —— 大请求体支持（101MB，适用于视频/项目文件）
    location = /api/admin/upload {
        client_max_body_size 101m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # 发送超时较长（120s），适合大文件上传
        proxy_send_timeout 120s;
        proxy_read_timeout 30s;
    }

    # 通用 API 路由 —— 所有 /api/* 请求代理到 Node.js 后端
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ---- 静态资源服务 ----

    # 用户上传文件 —— 以 /uploads/ 开头的请求映射到物理存储目录
    # 安全注意：禁止访问以点开头的隐藏文件，禁用符号链接（防止路径穿越）
    location ^~ /uploads/ {
        alias /var/lib/tech-club/uploads/;
        if ($uri ~ "(^|/)[.]") {
            return 404;
        }
        disable_symlinks if_not_owner from=/var/lib/tech-club/uploads;
        expires 30d;
    }

    # CSS/JS 静态资源 —— 缓存 5 分钟（版本更新时用户可较快获取新资源）
    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        expires 5m;
    }

    # 图片/视频/图标静态资源 —— 缓存 30 天（这些资源通常不会频繁变更）
    location ~* \.(?:svg|png|jpg|jpeg|webp|avif|ico|mp4|webm)$ {
        try_files $uri =404;
        expires 30d;
    }

    # --- Gzip 压缩 ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
